# Builds one Frappe image with every app listed in apps.json (ERPNext, HRMS, CRM, ...).
# Self-built because the official ghcr.io/frappe/crm images have shipped
# without the crm app since v1.67.1 (frappe/crm#2538).
# Uses frappe_docker's documented layered build with apps.json as a BuildKit secret.
name: Build Frappe ERP image

on:
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: frappe/frappe branch (apps in apps.json must be on the matching line)
        default: version-16

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Checkout this repo (apps.json)
        uses: actions/checkout@v4
        with:
          path: config

      - name: Show apps.json
        run: cat config/apps.json

      # Private apps (tuteome_crm) are added here, outside the checkout, so the
      # token never lands in this public repo or in the logs. Never `cat` this file.
      # TUTEOME_CRM_TOKEN: fine-grained PAT, read-only Contents on tuteome/tuteome_crm.
      - name: Add private apps
        env:
          TUTEOME_CRM_TOKEN: ${{ secrets.TUTEOME_CRM_TOKEN }}
        run: |
          test -n "$TUTEOME_CRM_TOKEN" || { echo "::error::Secret TUTEOME_CRM_TOKEN is not set"; exit 1; }
          merged="$RUNNER_TEMP/apps.json"
          jq --arg url "https://x-access-token:${TUTEOME_CRM_TOKEN}@github.com/tuteome/tuteome_crm" \
            '. + [{"url": $url, "branch": "main"}]' config/apps.json > "$merged"
          echo "APPS_JSON=$merged" >> "$GITHUB_ENV"
          echo "Apps in image: $(jq length "$merged") (+ frappe)"

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frappe-erp" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
          secret-files: |
            apps_json=${{ env.APPS_JSON }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.frappe_branch }}
            ${{ env.IMAGE }}:${{ inputs.frappe_branch }}-${{ github.run_number }}

      # The official images were never tested; this one is.
      # Every app listed in apps.json, plus the private apps and frappe, must be present and importable.
      - name: Verify all apps are in the image
        run: |
          expected=$(( $(jq length "$APPS_JSON") + 1 ))
          docker run --rm --entrypoint bash -e EXPECTED="$expected" "$IMAGE:${{ inputs.frappe_branch }}-${{ github.run_number }}" -c '
            set -e
            echo "apps/: $(ls apps | tr "\n" " ")"
            count=0
            for app in $(cat sites/apps.txt); do
              test -d "apps/$app"
              env/bin/python -c "import $app; print(\"$app\", getattr($app, \"__version__\", \"?\"))"
              count=$((count + 1))
            done
            echo "installed: $count, expected: $EXPECTED"
            test "$count" -eq "$EXPECTED"
          '

      # The image is private (it contains tuteome_crm), but the token must still never be in it.
      - name: Verify no token in the image
        run: |
          docker run --rm --entrypoint bash "$IMAGE:${{ inputs.frappe_branch }}-${{ github.run_number }}" -c '
            if grep -rqs "x-access-token" apps sites; then echo "token found in image"; exit 1; fi
            echo "no token in apps/ or sites/"
          '

      - name: Remove merged apps.json
        if: always()
        run: rm -f "$RUNNER_TEMP/apps.json"

      - name: Summary
        run: |
          echo "Image: \`$IMAGE:${{ inputs.frappe_branch }}-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
