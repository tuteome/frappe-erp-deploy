# Builds one Frappe image with every app listed in apps.json (ERPNext, HRMS, CRM, ...).
# Self-built because the official ghcr.io/frappe/crm images have shipped
# without the crm app since v1.67.1 (frappe/crm#2538).
# Uses frappe_docker's documented layered build with apps.json as a BuildKit secret.
name: Build Frappe ERP image

on:
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: frappe/frappe branch (apps in apps.json must be on the matching line)
        default: version-16

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Checkout this repo (apps.json)
        uses: actions/checkout@v4
        with:
          path: config

      - name: Show apps.json
        run: cat config/apps.json

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/frappe-erp" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
          secret-files: |
            apps_json=config/apps.json
          tags: |
            ${{ env.IMAGE }}:${{ inputs.frappe_branch }}
            ${{ env.IMAGE }}:${{ inputs.frappe_branch }}-${{ github.run_number }}

      # The official images were never tested; this one is.
      # Every app listed in apps.json (plus frappe) must be present and importable.
      - name: Verify all apps are in the image
        run: |
          expected=$(( $(jq length config/apps.json) + 1 ))
          docker run --rm --entrypoint bash -e EXPECTED="$expected" "$IMAGE:${{ inputs.frappe_branch }}-${{ github.run_number }}" -c '
            set -e
            echo "apps/: $(ls apps | tr "\n" " ")"
            count=0
            for app in $(cat sites/apps.txt); do
              test -d "apps/$app"
              env/bin/python -c "import $app; print(\"$app\", getattr($app, \"__version__\", \"?\"))"
              count=$((count + 1))
            done
            echo "installed: $count, expected: $EXPECTED"
            test "$count" -eq "$EXPECTED"
          '

      - name: Summary
        run: |
          echo "Image: \`$IMAGE:${{ inputs.frappe_branch }}-${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
